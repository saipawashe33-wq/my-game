<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Car Driving Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #333;
        }

        canvas {
            display: block;
            background: #222;
        }

        .instructions {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }

        .instructions span {
            color: #fff;
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <h1>Turbo Road Racer</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <div class="instructions">
        Use <span>Left/Right</span> or <span>A/D</span> to steer. Avoid the red cars!
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game States
    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let highScore = 0;

    // Road Properties
    let roadSpeed = 5;
    let roadLineOffset = 0;

    // Player Car
    const player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 100,
        width: 40,
        height: 70,
        speed: 5,
        dx: 0
    };

    // Obstacles Array
    let obstacles = [];
    let spawnTimer = 0;

    // Keyboard Controls
    const keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (!gameStarted && (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW")) {
            gameStarted = true;
        }
        if (gameOver && e.code === "Space") {
            resetGame();
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    function resetGame() {
        gameOver = false;
        score = 0;
        obstacles = [];
        player.x = canvas.width / 2 - 20;
        roadSpeed = 5;
    }

    function spawnObstacle() {
        const laneWidth = 100;
        const minX = 60;
        const maxX = canvas.width - 60 - 40;
        const randomX = Math.floor(Math.random() * 3) * 90 + 55; // 3 lanes

        obstacles.push({
            x: randomX,
            y: -100,
            width: 40,
            height: 70,
            color: "#ff3333"
        });
    }

    function update() {
        if (!gameStarted || gameOver) return;

        // Increase speed gradually
        roadSpeed = 5 + Math.floor(score / 500);

        // Move road lines
        roadLineOffset += roadSpeed;
        if (roadLineOffset >= 40) roadLineOffset = 0;

        // Player steering
        if (keys["ArrowLeft"] || keys["KeyA"]) {
            player.x -= player.speed;
        }
        if (keys["ArrowRight"] || keys["KeyD"]) {
            player.x += player.speed;
        }

        // Keep player within road boundaries (left wall at 40, right wall at 360)
        if (player.x < 45) player.x = 45;
        if (player.x > canvas.width - 45 - player.width) player.x = canvas.width - 45 - player.width;

        // Spawn obstacles
        spawnTimer++;
        if (spawnTimer > 60 - Math.min(roadSpeed * 2, 40)) {
            spawnObstacle();
            spawnTimer = 0;
        }

        // Update obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += roadSpeed;

            // Collision detection (AABB bounding box)
            if (
                player.x < obstacles[i].x + obstacles[i].width &&
                player.x + player.width > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameOver = true;
                if (score > highScore) highScore = score;
            }

            // Remove off-screen obstacles and increase score
            if (obstacles[i].y > canvas.height) {
                obstacles.splice(i, 1);
                score += 10;
            }
        }
    }

    function drawRoad() {
        // Grass background
        ctx.fillStyle = "#1e3d2f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Road surface
        ctx.fillStyle = "#444";
        ctx.fillRect(40, 0, canvas.width - 80, canvas.height);

        // Road borders (Yellow lines)
        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(40, 0, 6, canvas.height);
        ctx.fillRect(canvas.width - 46, 0, 6, canvas.height);

        // Center dashed lines
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -roadLineOffset;
        
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]); // Reset line dash
    }

    function drawCar(car) {
        ctx.save();
        ctx.translate(car.x, car.y);

        // Car Body
        ctx.fillStyle = car.color || "#00ffcc";
        ctx.beginPath();
        ctx.roundRect(0, 0, car.width, car.height, 8);
        ctx.fill();

        // Windshield
        ctx.fillStyle = "#111";
        ctx.fillRect(6, 15, car.width - 12, 15);
        ctx.fillRect(6, 45, car.width - 12, 8);

        // Headlights / Taillights
        ctx.fillStyle = car.color === "#ff3333" ? "#ffff00" : "#ff3333";
        ctx.fillRect(4, 2, 8, 4);
        ctx.fillRect(car.width - 12, 2, 8, 4);

        ctx.restore();
    }

    function drawUI() {
        ctx.fillStyle = "#ffffff";
        ctx.font = "18px 'Segoe UI', sans-serif";
        ctx.fillText(`Score: ${score}`, 60, 30);
        ctx.fillText(`High: ${highScore}`, canvas.width - 130, 30);

        if (!gameStarted) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("TURBO ROAD RACER", canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px 'Segoe UI', sans-serif";
            ctx.fillText("Press Space or Arrow Up to Start", canvas.width / 2, canvas.height / 2 + 20);
            ctx.textAlign = "left";
        } else if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff3333";
            ctx.font = "bold 32px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("CRASHED!", canvas.width / 2, canvas.height / 2 - 40);

            ctx.fillStyle = "#ffffff";
            ctx.font = "18px 'Segoe UI', sans-serif";
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 5);

            ctx.font = "14px 'Segoe UI', sans-serif";
            ctx.fillStyle = "#aaa";
            ctx.fillText("Press Space to Try Again", canvas.width / 2, canvas.height / 2 + 45);
            ctx.textAlign = "left";
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawRoad();

        // Draw Player
        drawCar({
            x: player.x,
            y: player.y,
            width: player.width,
            height: player.height,
            color: "#00ffcc"
        });

        // Draw Obstacles
        obstacles.forEach(obs => drawCar(obs));

        drawUI();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Start loop
    gameLoop();
</script>

</body>
</html>
